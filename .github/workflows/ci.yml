name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 语法检查 + 端到端测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: qwenpaw-xiaozhi-bridge

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: qwenpaw-xiaozhi-bridge/requirements.txt

      - name: 安装依赖
        working-directory: qwenpaw-xiaozhi-bridge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法编译检查 (py_compile)
        working-directory: qwenpaw-xiaozhi-bridge
        run: |
          python -m py_compile main.py bridge/*.py test_mock_e2e.py
          echo "SYNTAX OK"

      - name: 配置验证
        working-directory: qwenpaw-xiaozhi-bridge
        run: |
          python -c "
          from bridge.config import Config
          cfg = Config.from_env()
          print('agent_id       :', cfg.qwenpaw_agent_id)
          print('tts_provider   :', cfg.tts_provider)
          print('asr_provider   :', cfg.asr_provider)
          errs = cfg.validate()
          if errs:
              print('CONFIG WARNINGS (expected when no real keys):')
              for e in errs:
                  print('  -', e)
          else:
              print('CONFIG VALID')
          "

      - name: 端到端模拟测试
        working-directory: qwenpaw-xiaozhi-bridge
        run: timeout 180 python test_mock_e2e.py

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: qwenpaw-xiaozhi-bridge

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: qwenpaw-xiaozhi-bridge
          push: false
          tags: qwenpaw-xiaozhi-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
